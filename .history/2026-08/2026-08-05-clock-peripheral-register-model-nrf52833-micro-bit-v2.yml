    - "The consequence of writing LFCLKSRC while LFCLK is running, reasoning toward a clock-multiplexer glitch hazard."
  tried: —
  corrections:
    - "Predicted LFCLKSRCCOPY updates only after LFCLK reaches the Running state following the debounce/startup delay; corrected to: it latches at the moment LFCLKSTART is triggered, in sync with whatever LFCLKSRC held at that instant, before any startup delay."
    - "Named the task-triggered/actual-state registers for a LFCLKSTART scenario as HFCLKRUN.STATUS/HFCLKSTAT.STATE; corrected to the LFCLK-domain equivalents, LFCLKRUN.STATUS/LFCLKSTAT.STATE."
  bugs_found: —
