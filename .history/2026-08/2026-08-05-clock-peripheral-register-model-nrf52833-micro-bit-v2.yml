session:
  file: —
  source: "nRF52833 Product Specification v1.6, §5.4.2 LFCLK controller (incl. §5.4.2.5 LFSYNT) & §5.4.3.16-21 Registers (HFCLKRUN, HFCLKSTAT, LFCLKRUN, LFCLKSTAT, LFCLKSRCCOPY, LFCLKSRC)"
  status: completed
  attempted:
    - "Finish the CLOCK peripheral register material deferred by \"Reset & Clock Startup Behavior\": the LFCLKSRC truth table and the HFCLKRUN/HFCLKSTAT/LFCLKRUN/LFCLKSTAT/LFCLKSRCCOPY register bit-layouts."
  explored:
    - "Table 20 (LFCLKSRC configuration truth table, p.85) across all three SRC values (LFRC, LFXO, LFSYNT) and the role of the EXTERNAL and BYPASS fields."
